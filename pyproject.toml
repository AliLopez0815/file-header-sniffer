[project]
name = "file-header-sniffer"
version = "0.1.0"
description = "Reads the first N bytes of a file and identifies its type by magic-number signature."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
